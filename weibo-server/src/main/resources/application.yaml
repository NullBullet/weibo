server:
  port: 8080

spring:
  application:
    name: weibo-server
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${jun.datasource.driver-class-name}
      url: jdbc:mysql://${jun.datasource.host}:${jun.datasource.port}/${jun.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${jun.datasource.username}
      password: ${jun.datasource.password}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jun.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true