server:
  port: 8080

spring:
  application:
    name: weibo-server
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${jun.datasource.driver-class-name}
      url: jdbc:mysql://${jun.datasource.host}:${jun.datasource.port}/${jun.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${jun.datasource.username}
      password: ${jun.datasource.password}
  data:
    redis:
      host: ${jun.redis.host}
      port: ${jun.redis.port}
      database: ${jun.redis.database}
      timeout: ${jun.redis.timeout} # 使用时间格式化
      password: ${jun.redis.password}
      lettuce:
        pool:
          max-active: ${jun.lettuce.pool.max-active} # 最大连接数
          max-wait: ${jun.lettuce.pool.max-wait}    # 最大阻塞等待时间(负数表示没限制)
          max-idle: ${jun.lettuce.pool.max-idle}     # 最大空闲
          min-idle: ${jun.lettuce.pool.min-idle}     # 最小空闲

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jun.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com:
      jun:
        mapper: debug
        service: info
        controller: info

jun:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: Developed-a-SpringBoot-application-from-the-ground-up-independently
    # 设置jwt过期时间
    user-ttl: 7200000
    # 设置前端传递过来的令牌名称
    user-token-name: Authorization
  aliyun:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}