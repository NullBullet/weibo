server:
  port: 8080

spring:
  application:
    name: weibo-server
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${jun.datasource.driver-class-name}
      url: jdbc:mysql://${jun.datasource.host}:${jun.datasource.port}/${jun.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${jun.datasource.username}
      password: ${jun.datasource.password}
  data:
    redis:
      host: ${jun.redis.host}
      port: ${jun.redis.port}
      database: ${jun.redis.database}
      timeout: ${jun.redis.timeout} # 使用时间格式化
      password: ${jun.redis.password}
      lettuce:
        pool:
          max-active: ${jun.lettuce.pool.max-active} # 最大连接数
          max-wait: ${jun.lettuce.pool.max-wait}    # 最大阻塞等待时间(负数表示没限制)
          max-idle: ${jun.lettuce.pool.max-idle}     # 最大空闲
          min-idle: ${jun.lettuce.pool.min-idle}     # 最小空闲
  rabbitmq:
    host: ${jun.mq.host}
    port: ${jun.mq.port}
    username: ${jun.mq.username}
    password: ${jun.mq.password}
    publisher-confirm-type: correlated

    #消费者使用工厂模式时，应该显式指定确认模式
    listener:
      simple:
        acknowledge-mode: manual

    publisher-returns: true
    template:
      mandatory: true

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jun.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com:
      jun:
        service: info
        controller: info

jun:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    user-secret-key: Developed-a-SpringBoot-application-from-the-ground-up-independently
    # 设置jwt过期时间
    user-ttl: 7200000
    # 设置前端传递过来的令牌名称
    user-token-name: Authorization
  websocket:
    # WebSocket 握手 Origin 白名单，逗号分隔；生产环境部署时覆盖为真实前端域名
    allowed-origins: http://localhost:8081
    # CHAT 消息发送频率限制（连接级令牌桶）：rate 为每秒补充令牌数，burst 为桶容量；rate <= 0 关闭限流
    chat-rate-limit:
      rate: 10
      burst: 20
    # 连接空闲超时（秒）：超过该时间未收到任何消息（含 PING）的连接将被服务端关闭；
    # 必须大于前端心跳间隔
    idle-timeout-seconds: 300
  aliyun:
    endpoint: ${jun.aliyun.endpoint}
    access-key-id: ${jun.aliyun.access-key-id}
    access-key-secret: ${jun.aliyun.access-key-secret}
    bucket-name: ${jun.aliyun.bucket-name}