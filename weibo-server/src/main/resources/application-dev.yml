jun:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: weibo
    username: root
    password: root
  aliyun:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    region: cn-beijing
    bucket-name: java-ai-kurisutina

  redis:
    host: localhost
    port: 6379
    database: 1
    password: root
    timeout: 1800s

  lettuce:
    pool:
      max-active: 20  # 最大连接数
      max-wait: -1    # 最大阻塞等待时间(负数表示没限制)
      max-idle: 5     # 最大空闲
      min-idle: 0     # 最小空闲

  mq:
    host: localhost
    port: 5672
    username: guest
    password: guest